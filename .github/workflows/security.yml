name: Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  suspicious-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d2b3e369f7c9a2806bd6c8b91a3 # v4.0.3
        with:
          node-version-file: .nvmrc
      - name: Scan changed source files
        run: node scripts/check-suspicious-code.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"
