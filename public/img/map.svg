<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" fill="none">
  <!-- Land Base -->
  <rect width="600" height="400" fill="#F4F5F7"/>

  <!-- Waterway -->
  <path d="M-20 80 C 150 110, 220 220, 280 260 C 350 310, 480 340, 620 320 L 620 420 L -20 420 Z" fill="#DBEAFE"/>
  <path d="M-20 80 C 150 110, 220 220, 280 260 C 350 310, 480 340, 620 320" stroke="#93C5FD" stroke-width="4" fill="none"/>

  <!-- Parks & Green Spaces -->
  <rect x="50" y="30" width="120" height="90" rx="12" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  <rect x="420" y="50" width="130" height="110" rx="16" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>
  <rect x="80" y="270" width="100" height="80" rx="10" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="2"/>

  <!-- City Blocks / Building Parcels -->
  <g fill="#E5E7EB" opacity="0.6">
    <rect x="220" y="40" width="60" height="40" rx="4"/>
    <rect x="300" y="40" width="80" height="40" rx="4"/>
    <rect x="220" y="100" width="70" height="50" rx="4"/>
    <rect x="310" y="100" width="70" height="50" rx="4"/>
    <rect x="50" y="140" width="110" height="60" rx="4"/>
    <rect x="370" y="180" width="90" height="60" rx="4"/>
    <rect x="480" y="180" width="70" height="60" rx="4"/>
    <rect x="220" y="300" width="90" height="60" rx="4"/>
    <rect x="330" y="320" width="80" height="50" rx="4"/>
  </g>

  <!-- Minor Road Network -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="0" y1="340" x2="600" y2="340"/>
    <line x1="60" y1="0" x2="60" y2="400"/>
    <line x1="180" y1="0" x2="180" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="520" y1="0" x2="520" y2="400"/>
  </g>

  <!-- Major Arterial Highways -->
  <g stroke="#FDE68A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <path d="M 40 380 Q 250 210 560 60" fill="none"/>
  </g>
  <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <path d="M 40 380 Q 250 210 560 60" fill="none"/>
  </g>

  <!-- Center Pin Shadow -->
  <ellipse cx="300" cy="205" rx="14" ry="6" fill="#000000" opacity="0.2"/>

  <!-- Location Pulse Ring -->
  <circle cx="300" cy="180" r="32" fill="#EF4444" opacity="0.15"/>
  <circle cx="300" cy="180" r="22" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2" fill="none" opacity="0.5"/>

  <!-- Location Marker Pin -->
  <path d="M300 152 C285.6 152 274 163.6 274 178 C274 195 296 206 300 216 C304 206 326 195 326 178 C326 163.6 314.4 152 300 152 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="300" cy="176" r="8" fill="#FFFFFF"/>
  <circle cx="300" cy="176" r="4" fill="#EF4444"/>
</svg>
